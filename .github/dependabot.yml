version: 2
updates:
  # Actions GitHub (épinglées par SHA dans les workflows).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Dépendances Gradle (catalogue gradle/libs.versions.toml et build-logic).
  # Après chaque mise à jour, régénérer gradle/verification-metadata.xml :
  #   ./gradlew --write-verification-metadata sha256 help
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
