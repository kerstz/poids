name: CI
on: [push, pull_request]

# Jeton GITHUB_TOKEN en lecture seule : la CI ne publie rien.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions épinglées par SHA de commit (tag mutable en commentaire) ; mises à jour via Dependabot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # :core:test et :domain:test : modules JVM purs, non couverts par testDebugUnitTest.
      # roborazzi.mode=verify : les captures de référence sont comparées, jamais réécrites en CI.
      - run: ./gradlew checkArchitecture :app:checkPermissions :core:test :domain:test testDebugUnitTest :app:lintRelease assembleDebug -Proborazzi.mode=verify
