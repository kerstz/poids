name: CI
on: [push, pull_request]

# Jeton GITHUB_TOKEN en lecture seule : la CI ne publie rien.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions épinglées par SHA de commit (tag mutable en commentaire) ; mises à jour via Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # :core:test et :domain:test : modules JVM purs, non couverts par testDebugUnitTest.
      # roborazzi.mode=verify : les captures de référence sont comparées, jamais réécrites en CI.
      - run: ./gradlew checkArchitecture :app:checkPermissions :core:test :domain:test testDebugUnitTest :app:lintRelease assembleDebug -Proborazzi.mode=verify
      # Métadonnées F-Droid (longueurs max des textes fastlane).
      - run: tools/check-fastlane.sh

  # Vulnérabilités connues (OSV) sur tout le classpath Gradle, via gradle/verification-metadata.xml.
  # Les faux positifs d'outillage de build sont listés et justifiés dans osv-scanner.toml (avec date d'expiration).
  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=gradle/verification-metadata.xml
            --config=osv-scanner.toml
