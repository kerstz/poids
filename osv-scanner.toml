# Configuration osv-scanner (CI : job `osv-scanner`, local : `osv-scanner scan source -L gradle/verification-metadata.xml --config=osv-scanner.toml`).
#
# gradle/verification-metadata.xml couvre TOUT le classpath Gradle (plugins AGP/lint/KSP/Hilt inclus),
# pas seulement l'APK. Les vulnérabilités ci-dessous touchent des bibliothèques d'outillage de build
# (jamais empaquetées : vérifié sur `:app:dependencies --configuration releaseRuntimeClasspath`,
# voir docs/AUDIT.md M18). Elles ne peuvent être corrigées qu'en montant AGP ; chaque entrée expire
# (`effectiveUntil`) pour forcer une relecture. Toute vulnérabilité nouvelle fait échouer la CI.

